<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=, initial-scale=1.0">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Sharp:opsz,wght,FILL,GRAD@24,400,0,0&icon_names=arrow_back" />

    <style>
        body{
            background-color: black;
        }

        .title{
            font-size: xx-large;
            margin-top: 0;
            margin-left: 50px;
            /* background-color: red; */

            height: 120px;
            overflow: hidden;
            cursor: pointer;
        }

        
        h1{
            color: white;
            font-size: 70px
        }
        a{
            color: white;
            font-size: 70px;
            text-decoration: none;
            font-weight: bold;
        }


        .text{
            transform: translateY(0px);
            transition: transform 0.3s cubic-bezier(.13,.12,0,1);
        }

        .text:hover{
            transform: translateY(-120px);
        }
    </style>

</head>

<body>
    <div class="title">
        <div class="text">
            <h1 class="title-text">Contact</h1>
            <a class="back" href="./index.html">
                <span class="material-symbols-sharp">arrow_back</span>back
            </a>
        </div>
        
    </div>
</body>
</html>
